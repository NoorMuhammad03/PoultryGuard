name: mobile
description: "PoultryGuard mobile application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  image_picker: ^1.2.3
  image: ^4.9.1
  flutter_litert: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/models/poultryguard_disease_model.tflite
    - assets/models/labels.txt